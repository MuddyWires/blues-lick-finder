# One image for every service: built once from ./Dockerfile and tagged below.
x-app: &app
  build: .
  image: blues-lick-finder:local
  env_file: .env
  environment:
    # Use LICK_DATA_DIR=/app/data/sample for the bundled demo data.
    LICK_DATA_DIR: ${LICK_DATA_DIR:-/app/data}
  volumes:
    - ./data:/app/data

services:
  # The agent's Streamlit chat. `docker compose up --build`, then open
  # http://localhost:8501. Needs a .env (copy .env.example) and an indexed data/
  # folder (see `fetch` and `index` below).
  app:
    <<: *app
    ports:
      - "127.0.0.1:8501:8501"   # localhost only: the app has no login
    restart: unless-stopped

  # Fetches lesson topics from data/topics.txt into data/lessons.json.
  # Not started by `up`: docker compose --profile fetch run --rm fetch
  fetch:
    <<: *app
    command: ["python", "-m", "lick_finder.integrations.youtube_data"]
    profiles: ["fetch"]

  # Labels new lessons and embeds new chunks into data/. Run it after `fetch`:
  # docker compose --profile fetch run --rm index
  index:
    <<: *app
    command: ["python", "-m", "lick_finder.integrations.index"]
    profiles: ["fetch"]
