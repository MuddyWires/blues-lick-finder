[project]
name = "blues-lick-finder"
version = "0.1.0"
description = "Agent that finds well-taught blues guitar lessons, ranks them by teaching quality, and builds a tagged practice log"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gitsource>=0.0.5",
    "jaxn>=0.0.5",
    "logfire>=5.1.1",
    "minsearch>=0.2.0",
    "numpy>=2.0",
    "openai>=3.16.2",
    "pydantic-ai>=1.59.0",
    "python-dotenv>=1.2.3",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
app = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17",
]
# Only for the notebooks; kept out of the default install and out of CI.
notebooks = [
    "jupyter>=1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks", "reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
