name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Free tests (no model calls, no network)
        # No API key: the free tests never call OpenAI, and clients are built on first use.
        run: uv run pytest -q
